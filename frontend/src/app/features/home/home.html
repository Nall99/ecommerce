<section class="flex flex-wrap items-center gap-12 rounded-3xl bg-sand p-8 md:p-16">
  <div class="flex min-w-72 flex-1 flex-col items-start gap-5">
    <span class="text-[13px] font-extrabold uppercase tracking-widest text-brand"
      >Nova coleção</span
    >
    <h1 class="text-4xl font-extrabold leading-tight tracking-tight md:text-5xl">
      Estilo que acompanha o seu dia.
    </h1>
    <p class="max-w-md text-lg text-stone-700">
      Peças selecionadas com pagamento via Pix, cartão ou boleto.
    </p>
    <a
      routerLink="/produtos"
      class="inline-flex h-13 items-center rounded-full bg-brand px-7 font-extrabold text-white hover:opacity-90"
    >
      Ver coleção
    </a>
  </div>
  <div
    class="flex h-72 min-w-72 flex-1 items-center justify-center rounded-2xl bg-stone-300/60 text-sm text-stone-700 md:h-90"
  >
    Imagem de destaque
  </div>
</section>

<section class="mt-14">
  <h2 class="mb-5 text-2xl font-bold tracking-tight">Categorias</h2>
  <div class="grid grid-cols-2 gap-4 md:grid-cols-4">
    @for (c of categories(); track c.id) {
      <a
        routerLink="/produtos"
        [queryParams]="{ category: c.slug }"
        class="rounded-2xl border border-stone-200 bg-white px-6 py-7 text-lg font-extrabold hover:border-brand hover:text-brand"
      >
        {{ c.name }}
      </a>
    }
  </div>
</section>

<section class="mt-14">
  <div class="mb-5 flex items-baseline justify-between">
    <h2 class="text-2xl font-bold tracking-tight">Novidades</h2>
    <a routerLink="/produtos" class="text-sm font-semibold text-brand">Ver todos</a>
  </div>
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
    @for (p of featured(); track p.id) {
      <app-product-card [product]="p" />
    }
  </div>
</section>
