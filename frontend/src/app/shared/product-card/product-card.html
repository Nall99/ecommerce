<article class="flex flex-col gap-3">
  <a [routerLink]="['/produtos', product().slug]" class="group block">
    <div class="aspect-square overflow-hidden rounded-2xl bg-sand">
      @if (product().image_url) {
        <img
          [src]="product().image_url"
          [alt]="product().name"
          loading="lazy"
          class="size-full object-cover transition-transform duration-300 group-hover:scale-105"
        />
      } @else {
        <div class="flex size-full items-center justify-center text-[13px] text-muted">
          Sem imagem
        </div>
      }
    </div>
    <div class="mt-3">
      <p class="text-[13px] text-muted">{{ product().category.name }}</p>
      <h3 class="mt-0.5 text-base font-semibold group-hover:text-brand">{{ product().name }}</h3>
      <p class="mt-1 font-extrabold">{{ product().price | currency: 'BRL' }}</p>
    </div>
  </a>

  <button
    type="button"
    (click)="addToCart()"
    [disabled]="disabled()"
    class="h-11 rounded-full border-2 border-ink font-extrabold transition-colors hover:bg-ink hover:text-white disabled:cursor-not-allowed disabled:border-stone-300 disabled:text-stone-400 disabled:hover:bg-transparent"
  >
    {{ label() }}
  </button>
  <span class="sr-only" aria-live="polite">{{
    added() ? 'Produto adicionado ao carrinho' : ''
  }}</span>
</article>
